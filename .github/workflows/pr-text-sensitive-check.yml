name: PR text sensitive-term check

# Catches real account numbers / sheet ids that landed in a PR title or
# description instead of a placeholder. This is the backstop for the case a
# git-history rewrite can never fix: a PR's own title/description is GitHub
# metadata, not a git object, so a force-push never reaches it — the same
# gap that let real product identifiers survive in six pm-intelligence-engine
# PR descriptions after their commits had already been cleaned. See
# workspace-governance's docs/public-safe-aliases.md and
# docs/stock-trading-skills-pr-ref-purge-request.md.
#
# Requires a repo secret PR_SENSITIVE_TERMS: one real value per line (account
# numbers, sheet ids). Kept as a secret, not committed, specifically so this
# public workflow file doesn't itself have to name the values it checks for.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SENSITIVE_TERMS: ${{ secrets.PR_SENSITIVE_TERMS }}
        run: |
          if [ -z "$SENSITIVE_TERMS" ]; then
            echo "PR_SENSITIVE_TERMS secret is not set — nothing to check against. Skipping."
            exit 0
          fi

          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > /tmp/pr_text.txt

          found=0
          while IFS= read -r term; do
            [ -z "$term" ] && continue
            if grep -qF -- "$term" /tmp/pr_text.txt; then
              echo "::error::PR title/description contains a real account number or sheet id — use the placeholder from config/accounts.example.md instead."
              found=1
            fi
          done <<< "$SENSITIVE_TERMS"

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "This check exists because a git-history rewrite never reaches a PR's own title/description — only its commits. Edit the PR description to use the placeholder, not the real value, then this check will re-run automatically."
            exit 1
          fi

          echo "Clean."
