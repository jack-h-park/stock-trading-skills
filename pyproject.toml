[project]
name = "stock-trading-skills"
version = "0.1.0"
description = "Operating layer for agentic brokerage trading: strategy, guardrails, and provider adapters."
requires-python = ">=3.12"
dependencies = [
    # >=2.0.0, not >=1.0.0: the server API changed between them (1.x has
    # mcp.server.fastmcp, 2.x has mcp.server.MCPServer), and production runs
    # 2.0.0. A looser floor let mypy check against 1.x and "fix" a working import
    # into one that failed at load on the ops host (#48).
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# No __init__.py in tests/ or scripts/ -- without this, mypy resolves each
# file to a bare top-level module name (e.g. "test_foo", not "tests.test_foo"),
# which silently breaks the tests.* override below.
explicit_package_bases = true
mypy_path = ".:scripts"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
